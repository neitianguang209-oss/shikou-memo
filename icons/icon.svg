<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 思考メモ アイコンの元絵: やわらかい杏色の地に、考えごとの吹き出しと、その中のメモの行
       PNG は icons/render-icons.ps1 で作る(Edge で描いて縮小) -->
  <defs>
    <radialGradient id="bg" cx="0.3" cy="0.2" r="1.1">
      <stop offset="0" stop-color="#f3bf98" />
      <stop offset="1" stop-color="#d98a66" />
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="180" x2="0" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fffaf2" />
      <stop offset="1" stop-color="#f3e9da" />
    </linearGradient>
    <g id="bubble">
      <circle cx="520" cy="254" r="118" />
      <circle cx="688" cy="300" r="118" />
      <circle cx="778" cy="416" r="118" />
      <circle cx="747" cy="548" r="118" />
      <circle cx="610" cy="634" r="118" />
      <circle cx="430" cy="634" r="118" />
      <circle cx="293" cy="548" r="118" />
      <circle cx="262" cy="416" r="118" />
      <circle cx="352" cy="300" r="118" />
      <ellipse cx="520" cy="450" rx="262" ry="196" />
      <circle cx="262" cy="752" r="46" />
      <circle cx="176" cy="846" r="26" />
    </g>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" />
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />
  <use href="#bubble" fill="#8a4430" opacity="0.35" filter="url(#shadow)" transform="translate(16 30)" />
  <use href="#bubble" fill="url(#paper)" />

  <!-- メモの行 -->
  <g stroke="#86655c" stroke-width="28" stroke-linecap="round">
    <line x1="380" y1="378" x2="660" y2="378" />
    <line x1="380" y1="456" x2="660" y2="456" />
    <line x1="380" y1="534" x2="530" y2="534" />
  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.05" style="mix-blend-mode:overlay" />
</svg>
