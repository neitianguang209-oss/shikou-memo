<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- 思考メモ アイコンの元絵: 横顔の頭の中に、つながり合う考え(光る点と線)。いくつかは頭の外へ浮かび出る
       PNG は icons/render-icons.ps1 で作る(Edge で描いて縮小) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf6ea" />
      <stop offset="1" stop-color="#f4d9c0" />
    </linearGradient>
    <linearGradient id="mind" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#1f1d55" />
      <stop offset="0.45" stop-color="#4a3a92" />
      <stop offset="0.78" stop-color="#a85b9a" />
      <stop offset="1" stop-color="#f08f78" />
    </linearGradient>
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbea" />
      <stop offset="0.35" stop-color="#ffe7a6" />
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.7" />
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <path id="head" d="M350 1024 C 356 940 362 860 352 800 C 300 740 236 660 226 540 C 214 340 340 168 500 156 C 640 146 730 230 756 330 C 766 370 768 400 772 424 C 774 444 762 456 764 470 C 770 500 820 552 846 584 C 852 594 840 606 820 608 C 808 610 804 622 812 636 C 818 646 806 656 798 662 C 808 668 814 680 806 690 C 798 700 788 704 792 716 C 800 740 802 764 784 778 C 760 796 720 800 690 800 C 680 840 680 920 694 1024 Z" />
    <clipPath id="headClip"><use href="#head" /></clipPath>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" />
      <feOffset dx="18" dy="26" />
      <feFlood flood-color="#7a4a3a" flood-opacity="0.28" />
      <feComposite operator="in" in2="SourceGraphic" />
    </filter>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" />
    </filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" />
      <feColorMatrix type="saturate" values="0" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)" />

  <!-- 頭の影 -->
  <use href="#head" fill="#8a5a46" opacity="0.22" filter="url(#glow)" transform="translate(22 30)" />

  <!-- 頭の中 -->
  <use href="#head" fill="url(#mind)" />
  <g clip-path="url(#headClip)">
    <!-- もやのような光 -->
    <circle cx="420" cy="330" r="150" fill="#6f5fd6" opacity="0.45" filter="url(#glow)" />
    <circle cx="640" cy="470" r="130" fill="#ff9fb0" opacity="0.3" filter="url(#glow)" />
    <circle cx="360" cy="560" r="120" fill="#4fb6d8" opacity="0.25" filter="url(#glow)" />

    <!-- 小さな星 -->
    <g fill="#ffffff">
      <circle cx="300" cy="420" r="2.5" opacity="0.6" /><circle cx="560" cy="230" r="2" opacity="0.6" />
      <circle cx="690" cy="330" r="2.5" opacity="0.5" /><circle cx="330" cy="640" r="2" opacity="0.5" />
      <circle cx="470" cy="610" r="2.5" opacity="0.55" /><circle cx="610" cy="600" r="2" opacity="0.5" />
      <circle cx="260" cy="520" r="2" opacity="0.5" /><circle cx="420" cy="240" r="2" opacity="0.5" />
    </g>

    <!-- つながる考え -->
    <g stroke="#ffe7b0" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M370 300 L 480 370" stroke-width="4" />
      <path d="M480 370 L 610 300" stroke-width="4" />
      <path d="M480 370 L 540 500" stroke-width="5" />
      <path d="M540 500 L 660 450" stroke-width="3.5" />
      <path d="M540 500 L 400 520" stroke-width="3.5" />
      <path d="M400 520 L 310 430" stroke-width="3" />
      <path d="M310 430 L 370 300" stroke-width="3" />
      <path d="M610 300 L 660 450" stroke-width="3" />
      <path d="M370 300 L 470 220" stroke-width="2.5" opacity="0.7" />
      <path d="M400 520 L 470 620" stroke-width="2.5" opacity="0.6" />
    </g>
    <g>
      <circle cx="480" cy="370" r="52" fill="url(#node)" />
      <circle cx="480" cy="370" r="15" fill="#fffdf4" />
      <circle cx="540" cy="500" r="40" fill="url(#node)" />
      <circle cx="540" cy="500" r="11" fill="#fffdf4" />
      <circle cx="370" cy="300" r="34" fill="url(#node)" />
      <circle cx="370" cy="300" r="9" fill="#fffdf4" />
      <circle cx="610" cy="300" r="32" fill="url(#node)" />
      <circle cx="610" cy="300" r="8.5" fill="#fffdf4" />
      <circle cx="660" cy="450" r="30" fill="url(#node)" />
      <circle cx="660" cy="450" r="8" fill="#fffdf4" />
      <circle cx="400" cy="520" r="30" fill="url(#node)" />
      <circle cx="400" cy="520" r="8" fill="#fffdf4" />
      <circle cx="310" cy="430" r="26" fill="url(#node)" />
      <circle cx="310" cy="430" r="7" fill="#fffdf4" />
      <circle cx="470" cy="220" r="20" fill="url(#node)" />
      <circle cx="470" cy="220" r="5.5" fill="#fffdf4" />
      <circle cx="470" cy="620" r="20" fill="url(#node)" />
      <circle cx="470" cy="620" r="5.5" fill="#fffdf4" />
    </g>
    <!-- いま浮かんだ考え(きらめき) -->
    <path d="M480 318 L 488 360 L 530 370 L 488 380 L 480 422 L 472 380 L 430 370 L 472 360 Z" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- 輪郭のつや -->
  <use href="#head" fill="none" stroke="url(#rim)" stroke-width="5" />

  <!-- 頭の外へ浮かび出て、メモになる考え -->
  <path d="M610 300 C 660 250 712 214 772 196" fill="none" stroke="#a27bb8" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 13" opacity="0.85" />
  <circle cx="700" cy="232" r="9" fill="#f3a46c" opacity="0.9" />
  <g transform="translate(850 170) rotate(10)">
    <rect x="-82" y="-66" width="164" height="132" rx="18" fill="#7a4a3a" opacity="0.22" filter="url(#cardShadow)" transform="translate(8 12)" />
    <rect x="-82" y="-66" width="164" height="132" rx="18" fill="#fffaf1" />
    <path d="M-82 -48 A 18 18 0 0 1 -64 -66 L 64 -66 A 18 18 0 0 1 82 -48 L 82 -36 L -82 -36 Z" fill="#f3a46c" />
    <g stroke="#c7b3d6" stroke-width="9" stroke-linecap="round">
      <line x1="-54" y1="-6" x2="54" y2="-6" />
      <line x1="-54" y1="20" x2="54" y2="20" />
      <line x1="-54" y1="46" x2="16" y2="46" />
    </g>
  </g>

  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.07" style="mix-blend-mode:overlay" />
</svg>
